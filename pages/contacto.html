    <section class="contacto">
        <div class="contacto-header">
            <h1>Queremos conocerte un poco mejor</h1>
            <p>
                Por favor, déjanos tus datos de contacto para que podamos hablar contigo personalmente.
            </p>
        </div>

        <form class="formulario" id="contactForm">

            <div class="fila">
                <div class="campo">
                    <label for="nombre">Nombre y Apellido</label>
                    <input type="text" id="nombre" placeholder="Escribe tu nombre y apellido" required minlength="2">
                </div>
            </div> <div class="campo">
                <label for="phone">Número de teléfono</label>
                <div class="telefono-input">
                    <select id="country" required></select>
                    <input type="tel" id="phone" placeholder="Deja tu número de teléfono" required pattern="[0-9]+">
                </div>
            </div>

            <div class="campo">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Deja tu correo electrónico" required>
            </div>

            <div class="campo">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" placeholder="escribe tu mensaje..." required></textarea>
            </div>

            <div class="boton-container">
                <button type="submit">Enviar</button>
            </div>

        </form> </section>
