<body>

    <!-- nav -->
    <nav>
        <div class="logo">
            <img src="../multimedia/Logo Version 01.png" alt="XTRM SYSTEMS" style="height: 40px;">

        </ul>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>

    <!-- canvas -->
    <canvas></canvas>

    <section class="contacto">
        <div class="contacto-header">
            <h1>Queremos conocerte un poco mejor</h1>
            <p>
                Por favor, déjanos tus datos de contacto para que podamos hablar contigo personalmente.
            </p>
        </div>

        <!-- formulario de contacto -->
        <form class="formulario" id="contactForm">

            <!-- fila 1 -->
            <div class="fila">
                <div class="campo">
                    <label for="nombre">Nombres*</label>
                    <input type="text" id="nombre" placeholder="Pon tu nombre aquí" required minlength="2">
                </div>

                <div class="campo">
                    <label for="apellido">Apellidos*</label>
                    <input type="text" id="apellido" placeholder="Pon tus apellidos aquí" required minlength="3">
                </div>
            </div>

            <!-- telefono -->
            <div class="campo">
                <label for="phone">Número de teléfono*</label>
                <div class="telefono-input">
                    <select id="country" required></select>
                    <!-- Agregamos pattern para obligar a que sean solo números -->
                    <input type="tel" id="phone" placeholder="Pon tu número de teléfono aquí" required pattern="[0-9]+">
                </div>
            </div>

            <!-- correo -->
            <div class="campo">
                <label for="email">Correo electrónico*</label>
                <!-- El tipo "email" ya exige la estructura básica con @ -->
                <input type="email" id="email" placeholder="Pon tu correo electrónico aquí" required>
            </div>

            <!-- mensaje -->
            <div class="campo">
                <label for="mensaje">
                    Agregue un mensaje e indíquenos más detalles sobre lo que necesita o desea saber de nuestros productos (tipo de llanta o de vehículo).*
                </label>
                <textarea id="mensaje" placeholder="Pon tu mensaje aquí" required></textarea>
            </div>

            <!-- boton -->
            <div class="boton-container">
                <button type="submit">Enviar</button>
            </div>
        </form>
    </section>

    <!-- footer -->
    <footer class="main-footer">
        <div class="footer-container">
            <div class="footer-logo">
                <img src="../multimedia/Logo Version 01.png" alt="XTRM SYSTEMS">
            </div>
            <div class="footer-contact">
                <h2>Contacto</h2>
                <div class="emails">

                    <a href="mailto:rvanegas@xtrmsystems.com.co">rvanegas@xtrmsystems.com.co</a>
                </div>
                <p class="phone">+57 312 5444391</p>
                <div class="social-icons">

                    <a href="#"><i class="fab fa-facebook-f"></i></a>

            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 por XTRM SYSTEMS</p>
        </div>

</body>
