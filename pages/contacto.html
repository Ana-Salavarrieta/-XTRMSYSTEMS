<body>

    <!-- nav -->

            <img src="../multimedia/Logo Version 01.png" alt="XTRM SYSTEMS" style="height: 40px;">

            <span></span>

        </div>

    </nav>

    <!-- canvas -->
    <canvas></canvas>

    <section class="contacto">

    <div class="contacto-header">
        <h1>Queremos conocerte un poco mejor</h1>

        <p>
            Por favor, déjanos tus datos de contacto para que
            podamos hablar contigo personalmente.
        </p>
    </div>

    <form class="formulario">

        <!-- fila 1 -->
        <div class="fila">

            <div class="campo">
                <label>Nombres*</label>
                <input type="text" placeholder="Pon tu nombre aquí">
            </div>

            <div class="campo">
                <label>Apellidos*</label>
                <input type="text" placeholder="Pon tus apellidos aquí">
            </div>

        </div>

        <!-- telefono -->
        <div class="campo">
          <label>Número de teléfono*</label>

           <div class="telefono-input">

               <select id="country"></select>
  
               <input 
                 type="tel" 
                 id="phone" 
                   placeholder="Pon tu número de teléfono aquí">

  </div>
</div>

        <!-- correo -->
        <div class="campo">
            <label>Correo electrónico*</label>
            <input type="email" placeholder="Pon tu correo electrónico aquí">
        </div>

        <!-- mensaje -->
        <div class="campo">
            <label>
                Agregue un mensaje e indíquenos más detalles sobre lo
                que necesita o desea saber de nuestros productos
                (tipo de llanta o de vehículo).*
            </label>

            <textarea placeholder="Pon tu mensaje aquí"></textarea>
        </div>

        <!-- boton -->
        <div class="boton-container">
            <button type="submit">Enviar</button>
        </div>

    </form>

</section>

   

    <!-- footer -->
    <footer class="main-footer">

        <div class="footer-container">
